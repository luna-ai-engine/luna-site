<style>
:root{
  color-scheme:light;
  --ivory:#F7F3EC; --cream:#FCFAF7; --beige:#E8DED1; --tiffany:#91C9C1; --tiffany-dark:#6FAAA3; --btn:#79B8B0;
  --taupe:#514B45; --taupe-soft:#8B837A; --border:#DED7CE; --btn-border:#D9D0C6;
  --line:rgba(81,75,69,.07); --hover:#F2EDE6; --active-bg:#E5EFEC; --active-ink:#3F6964;
  --pos-bg:#E3F0ED; --pos-ink:#4D8079; --neu-bg:#EEE9E2; --neu-ink:#746D65; --warn-bg:#F2E6D4; --warn-ink:#9A7651;
  --chart:#91C9C1; --chart-2:#D8D0C6; --grid:rgba(81,75,69,.06);
  --shadow:0 8px 30px rgba(71,61,50,.05);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",Arial,sans-serif;
  /* compatibilité avec le code existant */
  --ink:var(--taupe); --muted:var(--taupe-soft); --faint:#A69E94; --surface:var(--cream); --sunk:var(--neu-bg); --line-strong:var(--border);
  --accent:var(--tiffany-dark); --good:var(--pos-ink); --warn:var(--warn-ink); --crit:#A5574B; --bar:var(--chart); --btn-ink:#FFFFFF; --mono:var(--sans);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--taupe);font-family:var(--sans);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
/* barre latérale */
/* hauteur de l'écran visible (dvh, avec repli vh) et défilement interne : la fin du menu reste atteignable sur une fenêtre
   basse ou un téléphone (JACK-0210-08, capture de David du 02/10/2026) */
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;padding:28px 16px 20px;display:flex;flex-direction:column;gap:28px;background:var(--ivory);border-right:1px solid var(--line)}
.brand{display:grid;justify-items:center;gap:6px;padding:4px 0 8px}
.brand img{width:58px;height:58px}
.wordmark{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:.42em;margin-right:-.42em;color:var(--taupe);line-height:1}
.tagline{font-size:9.5px;letter-spacing:.28em;margin-right:-.28em;color:var(--taupe-soft);text-transform:uppercase}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--taupe-soft);font:500 13.5px var(--sans);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;transition:background .2s ease,color .2s ease}
@media (hover:hover){.nav button:hover{background:var(--hover);color:var(--taupe)}}
.nav button[aria-current="page"]{background:var(--active-bg);color:var(--active-ink)}
.nav svg{width:18px;height:18px;flex:0 0 auto}
.nav .count{margin-left:auto;font-size:11.5px;color:var(--taupe-soft);font-weight:400}
.nav button[aria-current="page"] .count{color:var(--active-ink)}
.side .spacer{flex:1}
/* barre du haut, téléphone */
.topbar{display:none}
/* contenu */
main{padding:40px 48px 64px;min-width:0}
.panel{max-width:1040px;margin:0 auto;display:grid;gap:24px;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe-soft);font-weight:500}
h1,.h1{font-family:var(--serif);font-weight:500;font-size:48px;line-height:1.05;margin:0;letter-spacing:-.005em;color:var(--taupe);text-wrap:balance}
h2,.h2{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;margin:0;color:var(--taupe);text-wrap:balance}
.lead{color:var(--taupe-soft);font-size:15px;max-width:68ch;margin:0}
.section-title{font-family:var(--serif);font-weight:500;font-size:24px;margin:8px 0 0}
.status{display:flex;flex-wrap:wrap;gap:6px 18px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--taupe-soft)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--pos-ink)} .pill.warn{color:var(--warn-ink)} .pill.crit{color:var(--crit)}
/* cartes */
.card{background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;display:grid;gap:12px;transition:box-shadow .2s ease,transform .2s ease}
.card h3{margin:0;font-size:18px;font-weight:500;line-height:1.35;color:var(--taupe);text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:4px 20px;color:var(--taupe-soft);font-size:13.5px}
.row b{color:var(--taupe);font-weight:500}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.kpi{background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px}
.kpi .n{font-family:var(--sans);font-size:28px;font-weight:500;line-height:1.1;letter-spacing:-.01em;color:var(--taupe);font-variant-numeric:tabular-nums}
.kpi .kico{width:34px;height:34px;border-radius:10px;background:var(--active-bg);color:var(--active-ink);display:grid;place-items:center;margin-bottom:14px}
.kpi .kico svg{width:17px;height:17px}
.kpi .l{font-size:12.5px;color:var(--taupe-soft);margin-bottom:8px;font-weight:500}
/* étiquettes */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:500;border-radius:999px;padding:3px 10px;background:var(--neu-bg);color:var(--neu-ink);border:0}
.chip.good{background:var(--pos-bg);color:var(--pos-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.muted{background:var(--neu-bg);color:var(--neu-ink)}
.chip:not(.good):not(.warn):not(.muted){background:var(--pos-bg);color:var(--pos-ink)}
/* liens et textes */
a{color:var(--taupe);text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;overflow-wrap:anywhere;transition:text-decoration-color .15s ease}
a:hover{text-decoration-color:var(--tiffany-dark)}
.src{font-size:13px;color:var(--taupe-soft)} .src li{margin:4px 0}
.src ul,.research ul{margin:0;padding-left:16px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--taupe-soft);margin:2px 0}
q.quote{display:block;quotes:none;color:var(--taupe-soft);font-size:12.5px;margin-top:4px;padding-left:12px;border-left:2px solid var(--beige)}
q.quote::before{content:"\201C";color:var(--border)} q.quote::after{content:"\201D";color:var(--border)}
q.quote.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.quote-box{margin-top:4px} .quote-more{font-size:12px;margin:2px 0 0 12px;color:var(--taupe-soft)}
.research{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px;font-size:13.5px}
.research dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
.research dt{color:var(--taupe-soft);font-weight:500}
.research dd{margin:0}
.note{font-size:13px;color:var(--taupe-soft);max-width:75ch;margin:0}
.empty{color:var(--taupe-soft);font-size:14px;padding:32px 16px;text-align:center}
/* formulaires */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
/* Barre de filtres (JACK-1910-07) : la recherche prend la place restante, chaque menu prend la largeur de son libellé le plus long
   (jamais coupé) et passe à la ligne quand la place manque. */
.filters .q{flex:2 1 240px;min-width:0;width:auto}
.filters select[hidden]{display:none}
.filters[hidden]{display:none}
.filters select{flex:0 0 auto;width:auto;max-width:100%}
.filters .pick{flex:0 1 auto;min-width:min(100%,11em);max-width:100%}
input[type=search],select,textarea{width:100%;font:14px var(--sans);color:var(--taupe);background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:10px 14px;transition:border-color .2s ease}
input[type=search]:focus,select:focus,textarea:focus{outline:0;border-color:var(--tiffany)}
input::placeholder,textarea::placeholder{color:#A69E94}
textarea{min-height:110px;resize:vertical;line-height:1.55}
input[type=checkbox]{accent-color:var(--tiffany-dark)}
label.check{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--taupe-soft)}
.searchbar{position:relative}
.searchbar input{height:52px;border-radius:14px;padding-left:48px;font-size:15px}
.searchbar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--taupe-soft);pointer-events:none}
/* boutons */
.btn{font:500 13.5px var(--sans);border:1px solid var(--btn-border);background:transparent;color:var(--taupe);border-radius:10px;padding:9px 16px;cursor:pointer;transition:background .2s ease,border-color .2s ease}
@media (hover:hover){.btn:hover{background:var(--hover)}}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#FFFFFF}
@media (hover:hover){.btn.primary:hover{background:var(--tiffany-dark);border-color:var(--tiffany-dark)}}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible,tr:focus-visible{outline:2px solid var(--tiffany);outline-offset:2px}
/* tableaux éditoriaux */
.tablebox{overflow-x:auto;background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:0 18px;height:58px;border-bottom:1px solid var(--line);vertical-align:middle}
td{padding-top:10px;padding-bottom:10px;height:auto;min-height:58px}
tr{height:58px}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--taupe-soft);font-weight:500;background:transparent;white-space:nowrap}
tbody tr{transition:background .15s ease}
@media (hover:hover){tbody tr:hover td{background:var(--hover)}}
td.num,td.date{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--taupe-soft)}
td.name{font-weight:500}
td .legal{display:block;color:var(--taupe-soft);font-size:12px;font-weight:400}
tr:last-child td{border-bottom:0}
.dir-table tbody tr{cursor:pointer}
.dir-table .sm-only{display:none}
/* repères du lot 2 de Projects : Warm Lead (ouverture dans 4 à 8 mois) et Newly opened (ouverture datée de moins de 90 jours) */
.dir-table .stage{display:inline-block;padding:0 7px;border-radius:999px;background:var(--pos-bg);color:var(--pos-ink);font-size:12px;font-weight:500;line-height:1.6;white-space:nowrap}
.dir-table td.prio[data-stage="new"] .stage{background:var(--neu-bg);color:var(--neu-ink)}
.dir-table .stage + .lg-only{margin-left:6px}
.dir-table .pstatus{font-weight:500;color:var(--taupe);margin-right:6px}
.dir-table .pstatus:not(:last-child)::after{content:"\00a0·";font-weight:400;color:var(--faint)}
#dir-note{margin:0 0 10px}
/* liste de choix compacte (catégories des projets) : remplace le menu natif, que le téléphone affiche très espacé */
.pick{position:relative;min-width:0}
.pick-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:100%;font:14px var(--sans);color:var(--taupe);background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:10px 12px 10px 14px;cursor:pointer;text-align:left;transition:border-color .2s ease}
.pick-btn[aria-expanded="true"]{border-color:var(--tiffany)}
.pick-btn svg{width:16px;height:16px;flex:0 0 auto;color:var(--taupe-soft)}
.pick-label{min-width:0;overflow-wrap:anywhere}
.pick-list{position:absolute;z-index:20;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:min(340px,calc(100vw - 32px));max-height:min(60vh,420px);overflow-y:auto;margin:0;padding:4px;list-style:none;background:var(--cream);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(71,61,50,.12)}
.pick-list[hidden]{display:none}
.pick-opt{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:6px 10px;border-radius:8px;font-size:14px;line-height:1.35;color:var(--taupe);cursor:pointer}
.pick-opt:focus{outline:0}
.pick-opt:focus-visible{outline:2px solid var(--tiffany);outline-offset:-2px}
@media (hover:hover){.pick-opt:hover{background:var(--hover)}}
.pick-opt[aria-selected="true"]{background:var(--active-bg);color:var(--active-ink);font-weight:500}
.pick-n{flex:0 0 auto;font-size:12.5px;font-weight:400;color:var(--taupe-soft);font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--taupe-soft)}
.linkbtn{font:inherit;color:var(--taupe);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;text-align:left}
.linkbtn:hover{text-decoration-color:var(--tiffany-dark)}
.dd-row{cursor:pointer}.dd-row:hover td{background:var(--cream)}.dd-row .dd-open{font-weight:inherit;font-size:inherit;color:inherit;text-decoration:none}.dd-row .dd-open:focus-visible{outline:2px solid var(--tiffany-dark);outline-offset:3px;border-radius:4px}
/* graphiques */
.chart{background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px}
.chart h4{margin:0 0 14px;font-size:13px;color:var(--taupe-soft);font-weight:500}
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;align-items:end;height:130px;background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 25%}
.bar{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;gap:6px}
.bar .v{font-size:11.5px;color:var(--taupe-soft);font-variant-numeric:tabular-nums}
.bar .fill{align-self:end;background:var(--chart);border-radius:4px 4px 0 0;min-height:2px}
.bar .m{font-size:11.5px;color:var(--taupe-soft)}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:170px 1fr 48px;gap:12px;align-items:center;font-size:13px}
.hbar .track{height:8px;border-radius:999px;background:var(--chart-2);overflow:hidden}
.hbar .track span{display:block;height:100%;background:var(--chart);border-radius:999px}
.hbar .v{text-align:right;color:var(--taupe-soft);font-variant-numeric:tabular-nums}
/* sources : sous-onglets */
.subtabs{display:flex;flex-wrap:wrap;gap:8px}
.subtabs button{font:500 13px var(--sans);color:var(--taupe-soft);background:transparent;border:1px solid var(--btn-border);border-radius:999px;padding:7px 14px;cursor:pointer;transition:all .2s ease}
@media (hover:hover){.subtabs button:hover{background:var(--hover);color:var(--taupe)}}
.subtabs button[aria-pressed="true"]{background:var(--active-bg);border-color:var(--active-bg);color:var(--active-ink)}
.subtabs .count{margin-left:6px;font-size:11.5px;opacity:.8}
.subpanel{display:grid;gap:20px}
details{border-top:1px solid var(--line);padding:14px 0 0}
summary{cursor:pointer;font-weight:500;font-size:13.5px;color:var(--taupe-soft)}
summary:hover{color:var(--taupe)}
details p,details li{font-size:13.5px;color:var(--taupe-soft);max-width:75ch}
details p{margin:8px 0 0}
/* accueil */
.attention{display:grid;gap:0;background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.attention button{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 22px;cursor:pointer;font:inherit;color:inherit;transition:background .15s ease}
.attention button:last-child{border-bottom:0}
@media (hover:hover){.attention button:hover{background:var(--hover)}}
.attention .t{font-weight:500;color:var(--taupe)}
.attention .s{font-size:13px;color:var(--taupe-soft)}
.attention svg{width:16px;height:16px;color:var(--taupe-soft);grid-row:1 / span 2;grid-column:2}
/* automatisations */
.auto-list{display:grid;gap:16px}
.auto{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.auto .ico{width:40px;height:40px;border-radius:12px;background:var(--active-bg);color:var(--active-ink);display:grid;place-items:center}
.auto .ico svg{width:18px;height:18px}
.auto .t{font-weight:500}
.auto .s{font-size:13px;color:var(--taupe-soft)}
/* demandes et suivi */
.form{background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;display:grid;gap:12px}
.form .actions,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;color:var(--taupe-soft)}
.msg.ok{color:var(--pos-ink)} .msg.err{color:var(--crit)}
.mail{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--taupe-soft)}
.mail code{font-size:13px;color:var(--taupe);background:var(--neu-bg);padding:5px 10px;border-radius:8px;user-select:all}
.reply{border-left:2px solid var(--tiffany);padding-left:12px;font-size:13.5px}
.card .research select{border-radius:10px;padding:7px 12px;font-size:13px;width:auto}
.card textarea{min-height:72px}
/* fiche détaillée */
.sheet-back{position:fixed;inset:0;background:rgba(81,75,69,.18);z-index:40;animation:fadeonly .2s ease}
@keyframes fadeonly{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;top:16px;right:16px;bottom:16px;width:min(560px,calc(100% - 32px));background:var(--cream);border:1px solid var(--line);border-radius:18px;z-index:41;
  display:grid;grid-template-rows:auto 1fr;box-shadow:0 20px 60px rgba(71,61,50,.12);animation:slide .22s ease;overflow:hidden}
@keyframes slide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 26px 14px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:30px}
.sheet-body{overflow-y:auto;padding:20px 26px 40px;display:grid;gap:18px;align-content:start}
.sheet-body dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:0;font-size:14px}
.sheet-body dt{color:var(--taupe-soft);font-weight:500}
.sheet-body dd{margin:0}
.people{background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.people.inline{box-shadow:none;background:transparent}
.prow{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 20px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.prow:last-child{border-bottom:0}
.people.inline .prow{padding:12px 4px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--beige);color:var(--taupe);display:grid;place-items:center;font-size:12.5px;font-weight:500;letter-spacing:.04em}
.pname{font-size:15px;font-weight:400;color:var(--taupe);line-height:1.35}
.pmeta{font-size:13px;color:var(--taupe-soft);line-height:1.4}
.pside{display:flex;align-items:center;gap:10px;color:var(--taupe-soft)}
.pside svg{width:16px;height:16px;transition:transform .2s ease}

    db.collection("contacts").onSnapshot(snap => { contactsRaw = snap.docs.filter(d => d.exists).map(d => Object.assign({id: d.id}, d.data())); syncContacts(); renderCt(); renderDirList(); renderHome(); }, () => {});
    db.collection("suivi").onSnapshot(snap => { const s = {}; snap.docs.forEach(d => { if (d.exists) s[d.id] = d.data(); }); suivi = s; renderOpp(); renderHome(); renderAna(); }, () => {});
  })();
})();
</script>
